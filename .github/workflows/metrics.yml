name: Metrics

on:
  schedule:
    # Cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Lenguajes más usados
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AngelitUX
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/Santiago
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_colors: "python:#3572A5,shell:#89e051,typescript:#3178c6,javascript:#f1e05a,html:#e34c26,css:#563d7c,c:#555555,c++:#f34b7d"
