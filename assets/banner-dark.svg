<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" role="img" aria-label="Angel Pino Terminal Profile Banner">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="50%" stop-color="#0e0b1c"/>
      <stop offset="100%" stop-color="#080610"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#261942" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .cursor { animation: blink 1.05s infinite; fill: #ff7a00; }
    .label { fill: #8b949e; font-size: 13px; font-weight: 500; }
    .val { fill: #e6edf3; font-size: 13.5px; font-weight: 600; }
    .hud-title { fill: #c77dff; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
    .hud-key { fill: #ff9e00; font-size: 12px; font-weight: 600; }
    .hud-val { fill: #c9d1d9; font-size: 12px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="14" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="14" fill="url(#grid-pattern)"/>
  
  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.8" opacity="0.85"/>

  <!-- Top Window Header Bar -->
  <path d="M 1 14 Q 1 1 14 1 L 1186 1 Q 1199 1 1199 14 L 1199 44 L 1 44 Z" fill="#130e26"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2e1b4d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="25" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="22" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="600" y="27" text-anchor="middle" class="mono" fill="#a899c7" font-size="12.5" font-weight="500">
    angel@valparaiso-sec:~ (AngelitUX/profile) — zsh · Decimo Semestre UV
  </text>
  <rect x="1080" y="13" width="100" height="20" rx="4" fill="#251540" stroke="#ff7a00" stroke-width="0.8"/>
  <text x="1130" y="27" text-anchor="middle" class="mono" fill="#ff9e00" font-size="10.5" font-weight="700">ONLINE ●</text>

  <!-- Left Side: Terminal Interactive Prompt & Bio -->
  <g transform="translate(35, 75)" class="mono">
    <text x="0" y="15" fill="#c77dff" font-size="13.5" font-weight="700">┌──(</text>
    <text x="32" y="15" fill="#ff7a00" font-size="13.5" font-weight="700">angel㉿AngelitUX</text>
    <text x="150" y="15" fill="#c77dff" font-size="13.5" font-weight="700">)-[</text>
    <text x="175" y="15" fill="#ffffff" font-size="13.5">~/security-portfolio</text>
    <text x="345" y="15" fill="#c77dff" font-size="13.5" font-weight="700">]</text>

    <text x="0" y="38" fill="#c77dff" font-size="13.5" font-weight="700">└─$</text>
    <text x="35" y="38" fill="#e6edf3" font-size="13.5" font-weight="600">whoami --verbose --target="Práctica Profesional"</text>

    <!-- CLI Output Card -->
    <g transform="translate(15, 62)">
      <line x1="-5" y1="-8" x2="-5" y2="195" stroke="#36224d" stroke-width="2"/>

      <text x="10" y="15" class="label">OPERADOR:</text>
      <text x="135" y="15" class="val" fill="#c77dff">Ángel Gabriel Pino Cárdenas</text>

      <text x="10" y="42" class="label">TITULO:</text>
      <text x="135" y="42" class="val">Ingeniero Civil Informático (10º Semestre)</text>

      <text x="10" y="69" class="label">UNIVERSIDAD:</text>
      <text x="135" y="69" class="val">Universidad de Valparaíso, Chile 🇨🇱</text>

      <text x="10" y="96" class="label">ESPECIALIDAD:</text>
      <text x="135" y="96" class="val" fill="#ff9e00">Ciberseguridad Defensiva &amp; Infraestructura de Redes</text>

      <text x="10" y="123" class="label">UBICACIÓN:</text>
      <text x="135" y="123" class="val">Valparaíso, Chile [33.0472° S, 71.6127° W]</text>

      <text x="10" y="150" class="label">OBJETIVO:</text>
      <text x="135" y="150" class="val" fill="#38d9a9">Práctica Profesional Junior / Security &amp; NetOps</text>

      <text x="10" y="177" class="label">FILOSOFÍA:</text>
      <text x="135" y="177" fill="#9d4edd" font-size="12" font-style="italic">“The only real firewall is how fast you can think.”</text>
    </g>

    <!-- Prompt 2 with Blinking Cursor -->
    <g transform="translate(0, 280)">
      <text x="0" y="18" fill="#c77dff" font-size="13.5" font-weight="700">└─$</text>
      <text x="35" y="18" fill="#a899c7" font-size="13.5">nmap -sV -sC valpo.local &amp;&amp; audit --defense</text>
      <rect x="395" y="5" width="8" height="16" class="cursor"/>
    </g>
  </g>

  <!-- Right Side: Cyber Telemetry HUD Box -->
  <g transform="translate(740, 75)" class="mono">
    <rect x="0" y="0" width="425" height="305" rx="10" fill="#120c24" stroke="#381f5c" stroke-width="1.4"/>
    
    <path d="M 0 10 Q 0 0 10 0 L 415 0 Q 425 0 425 10 L 425 38 L 0 38 Z" fill="#1a1133"/>
    <text x="20" y="24" class="hud-title">SYS.TELEMETRY // SECURITY CORE</text>
    <circle cx="395" cy="20" r="5" fill="#ff7a00"/>

    <g transform="translate(22, 60)">
      <text x="0" y="15" class="hud-key">CORE STACK</text>
      <text x="130" y="15" class="hud-val">Linux · Bash · Docker · Python</text>

      <text x="0" y="42" class="hud-key">NETWORKS</text>
      <text x="130" y="42" class="hud-val">TCP/IP · DNS · HTTP/S · LAN</text>

      <text x="0" y="69" class="hud-key">SECURITY</text>
      <text x="130" y="69" class="hud-val">OWASP Top 10 · Nmap · Hardening</text>

      <text x="0" y="96" class="hud-key">DATABASES</text>
      <text x="130" y="96" class="hud-val">SQL · PostgreSQL · Firebase Rules</text>

      <text x="0" y="123" class="hud-key">FRAMEWORKS</text>
      <text x="130" y="123" class="hud-val">Angular · NestJS · TypeScript</text>

      <text x="0" y="150" class="hud-key">CERTIFICATES</text>
      <text x="130" y="150" class="hud-val" fill="#ff9e00">Cisco Ethical Hacker (En curso)</text>

      <text x="0" y="177" class="hud-key">SECURITY GOAL</text>
      <text x="130" y="177" class="hud-val">Defensa perimetral &amp; APIs seguras</text>

      <line x1="0" y1="198" x2="380" y2="198" stroke="#2a1945" stroke-width="1"/>
      <rect x="0" y="208" width="380" height="24" rx="5" fill="#22133b" stroke="#ff7a00" stroke-width="0.8"/>
      <text x="190" y="224" text-anchor="middle" fill="#ff7a00" font-size="11.5" font-weight="700" letter-spacing="0.08em">
        STATUS: CLEARANCE READY // DISPONIBLE
      </text>
    </g>
  </g>
</svg>